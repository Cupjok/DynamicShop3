name: DynamicShop

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 #https://github.com/actions/checkout/releases
    - name: Set up JDK 25
      uses: actions/setup-java@v4 #https://github.com/actions/setup-java/releases
      with:
        distribution: 'temurin'
        java-version: 25
        cache: maven
    - name: Build with Maven
      run: mvn -B clean package
    - run: mkdir staging && cp target/DynamicShop-*.jar staging
    - uses: actions/upload-artifact@v4 #https://github.com/actions/upload-artifact/releases
      with:
        name: Package
        path: staging

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
        cache: maven
    - name: Build with Maven
      run: mvn -B clean package
    # RELEASE_NOTES.md starts with an HTML comment explaining how to write it.
    # That is guidance for whoever edits the file, not something release readers
    # should see, so strip leading comment blocks before publishing.
    - name: Strip authoring comments from release notes
      run: perl -0pe 's/\A(?:\s*<!--.*?-->\s*)+//s' RELEASE_NOTES.md > release-body.md

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: target/DynamicShop-*.jar
        # The hand-written summary for this release; the auto-generated commit
        # changelog gets appended below it.
        body_path: release-body.md
        generate_release_notes: true
