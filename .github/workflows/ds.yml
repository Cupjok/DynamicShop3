name: DynamicShop

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 #https://github.com/actions/checkout/releases
    - name: Set up JDK 25
      uses: actions/setup-java@v4 #https://github.com/actions/setup-java/releases
      with:
        distribution: 'temurin'
        java-version: 25
        cache: maven
    - name: Build with Maven
      run: mvn -B clean package
    - run: mkdir staging && cp target/DynamicShop-*.jar staging
    - uses: actions/upload-artifact@v4 #https://github.com/actions/upload-artifact/releases
      with:
        name: Package
        path: staging

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
        cache: maven
    - name: Build with Maven
      run: mvn -B clean package
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: target/DynamicShop-*.jar
        generate_release_notes: true
